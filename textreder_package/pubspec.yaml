name: textreder
description: >
  A powerful Flutter package for extracting structured data from document images
  using OCR and regex-based field extraction. Configure fields via JSON and get
  results as Map<String, dynamic> with automatic type conversion.

version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

repository: https://github.com/yourusername/textreder
homepage: https://github.com/yourusername/textreder
documentation: https://pub.dev/packages/textreder

topics:
  - ocr
  - text-recognition
  - document-extraction
  - ml-kit
  - data-extraction
